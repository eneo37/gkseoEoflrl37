<!DOCTYPE html>
<html lang="ko">
<head>
     <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
     <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
     <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅방</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .chat-container {
      max-width: 400px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }

    .home-btn {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 16px;
      max-width: 70%;
      font-size: 14px;
    }

    .me {
      background: #4a90e2;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e5e5ea;
      color: black;
      margin-right: auto;
    }

    .chat-input {
      display: flex;
      padding: 8px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    button {
      margin-left: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      background: #4a90e2;
      color: white;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <!-- 🏠 홈 버튼 -->
      <a href="home.html">
        <img src="home.jpg" class="home-btn" alt="홈">
      </a>
      멍청이들
    </div>

    <div class="chat-messages" id="messages">
    
    </div>

    <div class="chat-input">
      <input id="msgInput" placeholder="메시지 입력">
      <button onclick="send()">전송</button>
    </div>
  </div>

  <script>
     const firebaseConfig = {
      apiKey: "AIzaSyDsxcN-ajSQZoxQhINuOFKXLGFzB4JzLEg",
      authDomain: "eneo3737.firebaseapp.com",
      projectId: "eneo3737",
      storageBucket: "eneo3737.firebasestorage.app",
      messagingSenderId: "965775914988",
      appId: "1:965775914988:web:67fc6743fd777e3b6672c9",
      measurementId: "G-ZLL5LBVWS7"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 2️⃣ 로그인 체크
    auth.onAuthStateChanged(user => {
      if (!user) location.href = "login.html";
    });

    // 3️⃣ 메시지 전송 함수
    function send() {
      const input = document.getElementById("msgInput");
      if (!input.value) return;

      db.collection("messages").add({
        text: input.value,
        uid: auth.currentUser.uid,
        time: Date.now()
      });

      input.value = "";
    }

    // 4️⃣ 실시간 메시지 표시
    const messagesDiv = document.getElementById("messages");
    db.collection("messages").orderBy("time").onSnapshot(snapshot => {
      messagesDiv.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const div = document.createElement("div");
        div.classList.add("message");
        div.classList.add(data.uid === auth.currentUser.uid ? "me" : "other");
        div.innerText = data.text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    });
  </script>

</body>
</html>
