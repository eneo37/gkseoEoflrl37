<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅방</title>

  <!-- Firebase SDK (Auth 제거) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDsxcN-ajSQZoxQhINuOFKXLGFzB4JzLEg",
      authDomain: "eneo3737.firebaseapp.com",
      projectId: "eneo3737",
      storageBucket: "eneo3737.firebasestorage.app",
      messagingSenderId: "965775914988",
      appId: "1:965775914988:web:67fc6743fd777e3b6672c9",
      measurementId: "G-ZLL5LBVWS7"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <style>
    body { font-family: Arial; background:#f4f6f8; margin:0; }
    .chat-container { max-width:400px; margin:auto; display:flex; flex-direction:column; height:100vh; background:white; }
    .chat-messages { flex:1; overflow-y:auto; padding:10px; }
    .message { margin-bottom:5px; padding:8px; border-radius:10px; max-width:70%; background:#e5e5ea; color:black; margin-right:auto; }
    .chat-input { display:flex; padding:8px; border-top:1px solid #ddd; }
    input { flex:1; padding:8px; border-radius:20px; border:1px solid #ccc; }
    button { margin-left:5px; padding:8px 12px; border:none; border-radius:20px; background:#4a90e2; color:white; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input id="msgInput" placeholder="메시지 입력">
      <button onclick="send()">전송</button>
    </div>
  </div>

  <script>
    // 메시지 전송
    function send() {
      const input = document.getElementById("msgInput");
      if (!input.value) return;

      db.collection("messages").add({
        text: input.value,
        time: Date.now()
      });

      input.value = "";
    }

    // 실시간 메시지 표시
    db.collection("messages").orderBy("time")
      .onSnapshot(snapshot => {
        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML = "";

        snapshot.forEach(doc => {
          const div = document.createElement("div");
          div.textContent = doc.data().text;
          div.className = "message"; // 모두 같은 스타일
          messagesDiv.appendChild(div);
        });

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
  </script>
</body>
</html>
