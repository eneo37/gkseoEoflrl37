<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: white;
      width: 90%;
      max-width: 360px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>로그인</h2>
    <input type="email" id="email" placeholder="이메일">
    <input type="password" id="password" placeholder="비밀번호">
    <button onclick="login()">로그인</button>
    <button onclick="signup()">회원가입</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDsxcN-ajSQZoxQhINuOFKXLGFzB4JzLEg",
      authDomain: "eneo3737.firebaseapp.com",
      projectId: "eneo3737",
      storageBucket: "eneo3737.firebasestorage.app",
      messagingSenderId: "965775914988",
      appId: "1:965775914988:web:67fc6743fd777e3b6672c9",
      measurementId: "G-ZLL5LBVWS7"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => { location.href = "home.html"; })
        .catch(e => alert(e.message));
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => { location.href = "home.html"; })
        .catch(e => alert(e.message));
    }
  </script>

</body>
</html>
